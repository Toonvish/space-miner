<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Space Miner</title>
  </head>
  <body>
    <div id="fps">-- FPS</div>
    <div id="pilots"></div>
    <div id="cargo">CARGO <b id="ore">0</b><span class="cap"> / <span id="cap">20</span></span>
      <div class="bar"><i></i></div>
      <div id="boost">BOOST<div class="bar"><i></i></div></div>
      <div id="miners"></div>
    </div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="labels"></div>
    <div id="target"><div class="label"></div><div class="bar"><i></i></div></div>
    <div id="hud">
      <div>SPEED <b id="speed">0</b></div>
      <div>W thrust · A/D turn · S brake · Shift boost · Space / LMB drill · E dock · F miner · wheel zoom</div>
    </div>

    <div id="login">
      <form autocomplete="off">
        <div class="kicker">CO-OP MINING SECTOR</div>
        <h1>SPACE MINER</h1>
        <label>PILOT CALLSIGN<input maxlength="16" placeholder="Pilot" /></label>
        <button type="submit">LAUNCH</button>
        <div class="msg"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
